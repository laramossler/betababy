name = "ledger-mvp"
main = "src/index.js"
compatibility_date = "2026-05-01"

# Static site assets — serves the JSX/HTML in the repo root.
# Run `wrangler deploy` from the worker/ directory; the assets binding picks
# up everything in the parent project root.
[assets]
directory = "../"
binding = "ASSETS"

# KV namespace for parsed trip items.
# Create with: wrangler kv namespace create LEDGER_ITEMS
# then paste the id below.
[[kv_namespaces]]
binding = "LEDGER_ITEMS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (set via `wrangler secret put`):
#   ANTHROPIC_API_KEY   — your sk-ant-... key
#   FORWARD_TO_LARA     — optional: email to forward raw inbound to as backup

# Optional public vars
[vars]
INBOX_DOMAIN = "in.theledger.co"
