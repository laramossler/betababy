project_id = "ledger-mvp"

[functions.parse-inbound-email]
# Postmark needs to call this without a JWT — auth is via ?secret=
verify_jwt = false

[functions.parse-email]
# Frontend-called with the user's JWT; default verification is fine
verify_jwt = true

[functions.exchange-key]
# Public — the URL key itself is the credential. Edge function looks
# the key up via service role; clients never carry a JWT to this one.
verify_jwt = false
