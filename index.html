<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>The Ledger — for Chloe</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="mask-icon" href="favicon.svg" color="#B8A07A" />
<meta name="theme-color" content="#0A0908" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#0A0908;color:#EDE8DF;font-family:'DM Sans',sans-serif;height:100%;width:100%;overflow:hidden}
#root{height:100%;width:100%}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#252320;border-radius:1px}
input,textarea{outline:none;background:transparent;border:none;color:inherit;font:inherit;width:100%}
input::placeholder,textarea::placeholder{color:#54504A}
button{font-family:inherit}
button:hover{filter:brightness(1.1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:0.45}50%{opacity:1}}
.rise{animation:rise 0.5s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fadeIn 0.4s ease both}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>

<script type="text/babel" src="mvp-flow.jsx"></script>
<script type="text/babel" src="mvp-feedback.jsx"></script>
<script type="text/babel" src="mvp-trip-detail.jsx"></script>
<script type="text/babel" src="mvp-home.jsx"></script>
<script type="text/babel" src="mvp-app.jsx"></script>
</body>
</html>
